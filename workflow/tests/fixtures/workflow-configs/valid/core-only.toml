# Config for the core-only proof.
#
# Deliberately has no [repository] section. #208 requires the toy workflow to
# need no repository configuration, which B3 made possible by making that
# section optional. Its absence here is part of the claim, not an omission.

config_id = "core-only"
workflow_type_id = "core-only-v1"

[runtime]
timeout_seconds = 60
max_retries = 1

[guards]
max_iterations = 4
max_file_changes = 4

[variables]
greeting = "produced without a domain package"
